name: flutter_corner_shape
description: >-
  CSS corner-shape for Flutter. Round, scoop, bevel, notch, squircle,
  and superellipse corners — per-corner control, smooth animations,
  and a drop-in ShapeBorder + Clipper.
version: 0.1.1
homepage: https://github.com/scapia/flutter_corner_shape
repository: https://github.com/scapia/flutter_corner_shape
issue_tracker: https://github.com/scapia/flutter_corner_shape/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
